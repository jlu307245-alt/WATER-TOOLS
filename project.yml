# XcodeGen 工程描述
#
# ⚠️ 注意：不要同时写 settings.INFOPLIST_FILE 和 info:，
#     XcodeGen 会自己管理 Info.plist 路径，手动指定会冲突。
#
name: QzxyTamper

options:
  bundleIdPrefix: com.sys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 关闭签名（云端编译产出未签名 ipa，交给 Sideloadly 签）
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  QzxyTamper:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: QzxyTamper
        includes:
          - "*.swift"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sys.qzxytamper
        PRODUCT_NAME: QzxyTamper
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        # 注意：这里【不要】写 INFOPLIST_FILE，由下面的 info: 自动管

    info:
      path: QzxyTamper/Info.plist
      properties:
        CFBundleDisplayName: 水表工具
        CFBundleName: QzxyTamper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 需要蓝牙以连接附近的水控设备
        NSBluetoothPeripheralUsageDescription: 需要蓝牙以连接附近的水控设备
