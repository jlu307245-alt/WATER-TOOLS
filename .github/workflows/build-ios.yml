name: Build iOS IPA (no Mac needed)

# 云端用 GitHub 的免费 macOS runner 编译，产出未签名 .ipa
# 下载后可用 Sideloadly / AltStore 在 Windows 上签名安装
#
# 触发方式：
#   - 手动点 “Run workflow”
#   - 或 push 到 main 分支

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14      # 免费 runner（Apple Silicon）
    timeout-minutes: 30

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 查看环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 3. 安装 XcodeGen
        run: brew install xcodegen

      - name: 4. 生成 Xcode 工程
        run: xcodegen generate

      - name: 5. 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project QzxyTamper.xcodeproj \
            -scheme QzxyTamper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tail -60

      - name: 6. 打包成 .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr QzxyTamper-unsigned.ipa Payload
          ls -lh QzxyTamper-unsigned.ipa
          unzip -l QzxyTamper-unsigned.ipa | head -20

      - name: 7. 上传 ipa 制品
        uses: actions/upload-artifact@v4
        with:
          name: QzxyTamper-ipa
          path: QzxyTamper-unsigned.ipa
          retention-days: 30
