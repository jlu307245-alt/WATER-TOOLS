name: Build iOS IPA (no Mac needed)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Release 发布需要写权限（用 Actions 自带的 GITHUB_TOKEN，无需手动配 token）
permissions:
  contents: write

jobs:
  build:
    # macos-15 自带 Xcode 16（支持 objectVersion 77）；
    # 下面的 sed 再兜一层，把 77 降回 56，兼容任意 Xcode 15+
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 环境信息
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== 可用 Xcode ==="
          ls /Applications | grep -i xcode || true
          echo "=== SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== 源码 ==="
          ls -la QzxyTamper/

      - name: 3. 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 4. 生成 Xcode 工程
        run: |
          xcodegen generate
          ls -la

          PBX=QzxyTamper.xcodeproj/project.pbxproj
          echo "=== 原始 objectVersion ==="
          grep "objectVersion" $PBX || true

          # 关键：把 Xcode 16 的工程格式(77)降回 Xcode 15 可读的 56
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' $PBX
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/' $PBX
          sed -i '' 's/objectVersion = 63;/objectVersion = 56;/' $PBX

          echo "=== 降级后 ==="
          grep "objectVersion" $PBX || true

          echo "=== 校验工程可读 ==="
          xcodebuild -list -project QzxyTamper.xcodeproj

      - name: 5. 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project QzxyTamper.xcodeproj \
            -scheme QzxyTamper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 6. 打包成 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "找到 app: $APP"
          if [ -z "$APP" ]; then
            echo "!! 没找到 .app"
            find build/Build/Products -maxdepth 3 -type d
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr QzxyTamper-unsigned.ipa Payload
          ls -lh QzxyTamper-unsigned.ipa
          unzip -l QzxyTamper-unsigned.ipa | head -25

      - name: 7. 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: QzxyTamper-ipa
          path: QzxyTamper-unsigned.ipa
          retention-days: 7

      # ── 发布到 Release：提供 ipa 直链，免登录/免解压 ──
      # 固定 tag ios-latest，每次覆盖同名资产，直链永不变：
      #   https://github.com/jlu307245-alt/WATER-TOOLS/releases/download/ios-latest/QzxyTamper-unsigned.ipa
      - name: 8. 发布到 Release（直链下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: iOS 最新构建（直链下载）
          body: |
            **点下面的 QzxyTamper-unsigned.ipa 直接下载**（不用登录、不用解压）

            - 提交: `${{ github.sha }}`
            - 时间: ${{ github.event.head_commit.timestamp }}
            - 修复: 偏移30 标志位归零 / accountId 动态解析

            安装：Sideloadly 选这个 ipa → 填 Apple ID → Start → 手机信任证书
          files: QzxyTamper-unsigned.ipa
          overwrite_files: true
