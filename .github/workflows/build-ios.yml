name: Build iOS IPA (no Mac needed)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 环境信息
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== 文件 ==="
          ls -la
          echo "=== 源码 ==="
          ls -la QzxyTamper/

      - name: 3. 安装 XcodeGen
        run: |
          brew install xcodegen || brew install xcodegen --force
          xcodegen --version

      - name: 4. 生成 Xcode 工程
        run: |
          xcodegen generate
          echo "=== 生成结果 ==="
          ls -la
          echo "=== 工程里的 scheme ==="
          xcodebuild -list -project QzxyTamper.xcodeproj

      - name: 5. 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project QzxyTamper.xcodeproj \
            -scheme QzxyTamper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 6. 打包成 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "找到 app: $APP"
          if [ -z "$APP" ]; then
            echo "!! 没找到 .app，列出目录："
            find build/Build/Products -maxdepth 3 -type d
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr QzxyTamper-unsigned.ipa Payload
          ls -lh QzxyTamper-unsigned.ipa

      - name: 7. 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: QzxyTamper-ipa
          path: QzxyTamper-unsigned.ipa
          retention-days: 30
